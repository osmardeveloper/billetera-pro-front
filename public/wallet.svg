<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Main wallet body (Charcoal/Neutral dark grey) -->
  <rect x="64" y="96" width="384" height="320" rx="32" fill="#1e293b" />
  
  <!-- Outer stitching or border accent (subtle light grey) -->
  <rect x="80" y="112" width="352" height="288" rx="20" fill="none" stroke="#475569" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Inner fold detail line -->
  <line x1="64" y1="256" x2="320" y2="256" stroke="#0f172a" stroke-width="12" />

  <!-- Wallet flap (overlapped leather piece on the right side) -->
  <path d="M300,192 h116 c16,0 28,12 28,28 v72 c0,16 -12,28 -28,28 H300 Z" fill="#334155" />
  
  <!-- Stitching on flap -->
  <path d="M310,208 h96 c8,0 14,6 14,14 v44 c0,8 -6,14 -14,14 H310" fill="none" stroke="#64748b" stroke-width="6" stroke-dasharray="10 8" />

  <!-- Metal clasp/snap button (Neutral silver/platinum) -->
  <circle cx="390" cy="256" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="6" />
</svg>
